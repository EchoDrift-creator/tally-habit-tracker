<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tally: habit tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#16202B; --ink-2:#465565; --ink-3:#6F7F92;
  --line:#DCE3EB; --line-2:#C5CFDA; --btn:#16202B; --btn-ink:#FFFFFF; --danger:#C93B3B; --focus:#2A6FDB; --scrim:rgba(12,18,26,.45);
  --fd:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1319; --surface:#171E26; --surface-2:#1D2630; --ink:#E9EFF5; --ink-2:#AAB7C4; --ink-3:#8493A3;
    --line:#27313C; --line-2:#374453; --btn:#E9EFF5; --btn-ink:#0E1319; --danger:#F0787A; --focus:#6EA2F5; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#171E26; --surface-2:#1D2630; --ink:#E9EFF5; --ink-2:#AAB7C4; --ink-3:#8493A3;
  --line:#27313C; --line-2:#374453; --btn:#E9EFF5; --btn-ink:#0E1319; --danger:#F0787A; --focus:#6EA2F5; --scrim:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.i{width:20px;height:20px;flex:none}
.fl{width:15px;height:15px;flex:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
.muted{color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font:600 15px var(--fb);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{height:54px;padding:0 28px;font-size:16px}
.ib{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;color:var(--ink-2)}
.ib:hover{background:var(--line)}
.rb{display:inline-grid;place-items:center;min-width:52px;height:52px;padding:0 8px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2);font:600 15px var(--fb);color:var(--ink);font-variant-numeric:tabular-nums}
.rb:active{transform:scale(.95)}
.rb.sm{min-width:44px;height:44px;border-radius:13px}

/* top + hero */
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:9px;font:700 20px var(--fd);letter-spacing:-.02em}
.brand .i{width:26px;height:26px}
.hero{padding:6px 0 18px}
.hero-d{font-size:14px;color:var(--ink-3);font-weight:500}
.hero-h{font:700 36px/1.02 var(--fd);letter-spacing:-.03em;margin:4px 0 14px;font-variation-settings:'opsz' 72}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:10px;border-radius:5px;background:var(--c-soft);max-width:80px}
.segs i.on{background:var(--c)}

/* toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--line)}
.seg button{padding:7px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg.sm button{padding:6px 11px;font-size:13px}
.nav{display:flex;align-items:center;gap:2px}
.nav .lbl{font-weight:600;font-size:14.5px;min-width:0;padding:0 4px;text-align:center;font-variant-numeric:tabular-nums}
.nav .ib{width:38px;height:38px}
.pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2);margin-left:6px}

/* week view */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -16px 8px;padding:8px 30px;background:var(--bg);display:grid;grid-template-columns:repeat(7,1fr);gap:6px;border-bottom:1px solid var(--line)}
.sd{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--ink-3);font-weight:600;gap:1px}
.sd b{font:600 14px var(--fb);color:var(--ink);padding:1px 7px;border-radius:9px;font-variant-numeric:tabular-nums}
.sd.is-today b{background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:6px 14px 14px}
.card-h{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0 10px;min-height:56px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.dot.big{width:16px;height:16px}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt b{font:650 17px/1.2 var(--fd);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:9px;font:600 13px var(--fb);background:var(--c-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.chip .fl{color:var(--c)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 2px 0;font-size:12.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:5px;border:2px solid transparent;display:inline-block;--c:var(--ink-2);--c-mid:var(--line-2)}
.lg.c-done{background:var(--c);border-color:var(--c)}
.lg.c-due{border-color:var(--c)}
.lg.c-miss{border:2px dashed var(--c-mid)}
.lg.c-rest{border:0;position:relative}
.lg.c-rest::after{content:'';position:absolute;left:6px;top:6px;width:4px;height:4px;border-radius:50%;background:var(--line-2)}

/* cells */
.cell{position:relative;width:100%;height:44px;border-radius:14px;display:grid;place-items:center;border:2px solid transparent;color:var(--ink-3);font:600 13px var(--fb);font-variant-numeric:tabular-nums;transition:transform .12s ease,background-color .15s ease}
.cell:not(:disabled):active{transform:scale(.92)}
.cell .i{width:18px;height:18px}
.cell.c-rest::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.cell.cal.c-rest::after,.cell.m.c-rest::after{display:none}
.cell.c-due{border-color:var(--c)}
.cell.c-miss{border:2px dashed var(--c-mid)}
.cell.c-open{border-color:var(--c-mid)}
.cell.c-part{border-color:var(--c);color:var(--ink);background:linear-gradient(to top,var(--c-soft) var(--fill),transparent var(--fill))}
.cell.c-done{background:var(--c);border-color:var(--c);color:var(--c-ink)}
.cell.is-future{opacity:.42}
.cell:disabled{opacity:.42}
.cell.is-today{box-shadow:0 0 0 3px var(--c-soft)}
.cell.pop{animation:pop .34s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.cell.m{width:30px;height:30px;border-radius:10px;font-size:11px;margin:0 auto}
.cell.m .i{width:15px;height:15px}
.cell.cal{height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1}
.cell.cal .dn{font-size:14px;font-weight:600}
.cell.cal .dv{font-size:10.5px;font-weight:600;opacity:.85}
.cell.cal.c-rest{color:var(--ink-2)}

/* month matrix */
.matrix-wrap{overflow-x:auto;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);-webkit-overflow-scrolling:touch}
.matrix{border-collapse:separate;border-spacing:0;min-width:max-content}
.matrix th,.matrix td{padding:0;text-align:center;font-weight:400}
.matrix .nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;width:140px;min-width:140px;max-width:140px;padding:7px 10px 7px 14px;box-shadow:1px 0 0 var(--line)}
.matrix .nmb{display:flex;align-items:center;gap:8px;width:100%;font:600 14px var(--fb)}
.matrix .nmb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matrix .nm small{display:flex;gap:8px;font-size:11.5px;color:var(--ink-3);padding-left:20px;font-variant-numeric:tabular-nums}
.matrix .nm small .fl{color:var(--c);width:12px;height:12px;vertical-align:-1px}
.matrix .dh{min-width:36px;width:36px;padding:8px 0 6px;font-size:11px;color:var(--ink-3);font-weight:500}
.matrix .dh b{display:block;font:600 13px var(--fb);color:var(--ink)}
.matrix .dh.wkstart,.matrix td.wkstart{box-shadow:inset 1px 0 0 var(--line)}
.matrix tbody td{height:54px;border-top:1px solid var(--line)}
.matrix tbody .nm{border-top:1px solid var(--line)}
.matrix td.is-today,.matrix th.is-today{background:var(--surface-2)}
.matrix thead .nm{background:var(--surface)}

/* fab + empty */
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:8;display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 18px;border-radius:18px;background:var(--btn);color:var(--btn-ink);font:600 15.5px var(--fb);box-shadow:0 10px 24px -8px rgba(10,16,24,.5)}
.empty{padding:14px 0}
.empty h2{font:700 26px/1.1 var(--fd);letter-spacing:-.02em;margin-bottom:8px}
.empty p{color:var(--ink-2);max-width:46ch;margin-bottom:20px}
.tpl{margin-top:28px;display:grid;gap:8px}
.tpl>p{margin:0 0 2px;font-size:13.5px;color:var(--ink-3)}
.tpl button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.tpl b{font-weight:600}
.tpl small{display:block;color:var(--ink-3);font-size:12.5px}

/* detail */
.dh-bar{display:flex;align-items:center;justify-content:space-between;height:60px;margin:0 -8px}
.d-title{padding:4px 0 18px}
.d-title h1{display:flex;align-items:center;gap:10px;font:700 30px/1.08 var(--fd);letter-spacing:-.025em}
.d-title p{margin-top:6px;color:var(--ink-2)}
.d-title .sch{margin-top:8px;display:inline-block;font-size:13px;font-weight:600;padding:4px 11px;border-radius:9px;background:var(--c-soft)}
.stats{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:auto auto;gap:10px;margin-bottom:10px}
.tile{background:var(--surface);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px}
.tile small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500}
.tile .big{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.tile .big b{font:700 40px/1 var(--fd);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .big span{font-size:13px;color:var(--ink-2)}
.tile.ring{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.ring svg{width:150px;height:150px}
.ring .pv{font:700 30px var(--fd);letter-spacing:-.03em;fill:var(--ink)}
.ring .sub{font-size:12.5px;color:var(--ink-2)}
.meta{font-size:13px;color:var(--ink-2);margin:2px 2px 14px}
.panel{background:var(--surface);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);padding:16px;margin-bottom:12px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h2{font:650 18px var(--fd);letter-spacing:-.01em}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-sum{margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.cal-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gl.dash{stroke:var(--ink-3);stroke-dasharray:4 4}
.chart .ax{fill:var(--ink-3);font:500 10px var(--fb)}
.chart .vl{fill:var(--ink-2);font:600 9.5px var(--fb)}
.chart .stub{fill:none;stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:3 3}
.empty-note{color:var(--ink-3);font-size:14px;padding:6px 0}
.runs{display:flex;flex-direction:column;gap:10px}
.run{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.run .bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;grid-column:1/3}
.run .bar i{display:block;height:100%;border-radius:6px;background:var(--c)}
.run .rl{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.run .rd{font-size:12.5px;color:var(--ink-3);text-align:right}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--c-soft);margin-left:8px}

/* form */
.fh{display:flex;align-items:center;justify-content:space-between;height:60px}
.fh b{font:650 17px var(--fd)}
.fh span{width:44px}
.steps{list-style:none;display:flex;gap:8px;margin:2px 0 22px;padding:0}
.steps li{flex:1}
.st{display:flex;align-items:center;gap:8px;width:100%;padding:0 0 8px;font-size:13.5px;font-weight:600;color:var(--ink-3);border-bottom:3px solid var(--line)}
.st i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:var(--line);color:var(--ink-2)}
.st.on{color:var(--ink);border-color:var(--ink)}
.st.on i{background:var(--ink);color:var(--bg)}
.st.past{color:var(--ink-2);border-color:var(--ink-3)}
.q{font:700 27px/1.12 var(--fd);letter-spacing:-.025em;margin-bottom:18px}
.fld{display:block;margin-bottom:20px}
.fld>span{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.fld>span em{font-style:normal;font-weight:400;color:var(--ink-3);margin-left:6px}
.inp{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 14px;font:500 16px var(--fb);color:var(--ink)}
textarea.inp{padding:12px 14px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--c-soft,rgba(42,111,219,.2))}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:42px;height:42px;border-radius:14px;background:var(--c);display:grid;place-items:center;color:var(--c-ink);position:relative}
.sw .i{width:18px;height:18px}
.sw.custom{background:conic-gradient(#E8543F,#E9B824,#2FA363,#2A9BE0,#7C4DDB,#E85D8E,#E8543F);cursor:pointer;overflow:hidden}
.sw.custom.on::after{content:'';position:absolute;inset:11px;border-radius:50%;background:var(--surface)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.optw{margin-bottom:10px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.optw.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;padding:15px 16px}
.opt b{display:block;font:650 16px var(--fd)}
.opt small{display:block;color:var(--ink-3);font-size:13.5px;margin-top:1px}
.rad{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line-2);flex:none;margin-top:1px;position:relative}
.optw.sel .rad{box-shadow:inset 0 0 0 2px var(--ink)}
.optw.sel .rad::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--ink)}
.subf{padding:0 16px 16px 52px}
.subf .seg{margin-bottom:12px;flex-wrap:wrap}
.subf label.l,.subf .l{display:block;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.stp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stp-in{width:76px;height:44px;text-align:center;border-radius:13px;border:1.5px solid var(--line-2);background:var(--bg);font:600 17px var(--fb);color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.stp-in::-webkit-outer-spin-button,.stp-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp-l{color:var(--ink-2);font-size:14px;margin-left:4px}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dc{min-width:48px;height:44px;padding:0 10px;border-radius:13px;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line-2);text-align:center;display:grid;place-items:center;background:var(--bg)}
.dc[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mgrid .dc{min-width:0;padding:0;height:40px;font-size:13px}
.mgrid .dc.wide{grid-column:span 2}
.summary{margin:2px 0 8px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;color:var(--ink-2)}
.summary b{color:var(--ink)}
.err{margin:6px 0 0;color:var(--danger);font-weight:600;font-size:14px}
.ff{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.ff-in{max-width:720px;margin:0 auto;display:flex;gap:10px;justify-content:space-between;align-items:center}
.ff-in .grow{display:flex;gap:10px;margin-left:auto}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:90%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.9,.3,1)}
.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh-h b{font:650 19px var(--fd);display:block}
.sh-h small{color:var(--ink-3);font-size:13.5px}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}
.ctr-v{text-align:center;flex:1;min-width:0}
.ctr-v input{width:100%;text-align:center;border:0;background:transparent;font:700 54px/1 var(--fd);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.ctr-v input::-webkit-outer-spin-button,.ctr-v input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctr-v small{display:block;color:var(--ink-3);font-size:13.5px}
.pbar{height:12px;border-radius:6px;background:var(--c-soft);overflow:hidden;margin-bottom:18px}
.pbar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .2s ease}
.sh-act{display:flex;gap:10px}
.sh-act .btn{flex:1;padding:0 12px}
.modal{position:fixed;z-index:21;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:400px;margin:0 auto;background:var(--surface);border-radius:22px;padding:22px;animation:fade .2s ease}
.modal h3{font:700 21px var(--fd);margin-bottom:8px}
.modal p{color:var(--ink-2);margin-bottom:18px}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1;padding:0 10px}
.setrow{margin:6px 0 18px}
.setrow>b{display:block;margin-bottom:8px;font-weight:600}

  plus: ic('<path d="M12 5v14M5 12h14"/>', 2.4),
  minus: ic('<path d="M5 12h14"/>', 2.4),
  left: ic('<path d="M15 6l-6 6 6 6"/>'),
  right: ic('<path d="M9 6l6 6-6 6"/>'),
  close: ic('<path d="M6 6l12 12M18 6L6 18"/>'),

const COLORS = ['#E8543F', '#F08A24', '#E9B824', '#8DBB2F', '#2FA363', '#12A4A0', '#2A9BE0', '#3D63DD', '#7C4DDB', '#C43FA8', '#E85D8E', '#5B6B7F'];

const TEMPLATES = [
  { name: 'Drink water', desc: 'Stay hydrated through the day.', color: '#2A9BE0', type: 'count', goal: 8, unit: 'glasses', kind: 'daily' },
  { name: 'Read', desc: 'Twenty minutes with a book.', color: '#7C4DDB', type: 'check', kind: 'daily' },
  { name: 'Workout', desc: 'Any movement counts.', color: '#E8543F', type: 'check', kind: 'weekly', perWeek: 3 },
  { name: 'Plan the week', desc: 'Sunday reset.', color: '#2FA363', type: 'check', kind: 'days', days: [0] },
  { name: 'Wake-up time', desc: 'Write in when you got up.', color: '#F08A24', type: 'log', vk: 'time' },
  { name: 'Bedtime', desc: 'Write in when you went to sleep.', color: '#7C4DDB', type: 'log', vk: 'night' },
  { name: 'Study hours', desc: 'Write in how long you studied.', color: '#3D63DD', type: 'log', vk: 'dur' }

/* =========================================================
   State
   ========================================================= */
const state = {
  ready: false, habits: [], settings: { weekStart: 1 },
  view: 'home', mode: 'week', anchor: T(), hid: null, calMonth: 0, gran: 'week', lgRange: 30,
  draft: null, sheet: null, pop: null, homeScroll: 0

const find = id => state.habits.find(h => h.id === id);
const byOrder = (a, b) => (a.order - b.order) || (a.id < b.id ? -1 : 1);

function normalize(h) {
  const s = h.sched && h.sched.kind ? h.sched : { kind: 'daily' };
  if (s.kind === 'days' && !Array.isArray(s.days)) s.days = [1, 3, 5];
  if (s.kind === 'weekly') s.perWeek = clampN(s.perWeek || 3, 1, 7);

  const o = {
    id: h.id, name: h.name || 'Untitled', desc: h.desc || '',
    color: /^#[0-9a-f]{6}$/i.test(h.color || '') ? h.color : '#3D63DD',
    type: asLog ? 'log' : h.type === 'count' ? 'count' : 'check', goal: Math.max(1, Number(h.goal) || 1), unit: h.unit || '',

  };
  if (asLog) {

    o.vk = ['time', 'night', 'dur', 'num'].indexOf(h.vk) >= 0 ? h.vk : 'num';
    if (o.vk !== 'num') o.unit = '';
    o.sched = { kind: 'daily' };
    const clean = {};
    Object.keys(o.logs).forEach(k => { const v = Number(o.logs[k]); if (/^\d{4}-\d{2}-\d{2}$/.test(k) && o.logs[k] !== null && o.logs[k] !== '' && isFinite(v)) clean[k] = v; });

}

/* =========================================================
   Habit engine
   ========================================================= */
const isCheck = h => h.type === 'check';
const goalOf = h => isCheck(h) ? 1 : Math.max(1, h.goal || 1);
const val = (h, n) => h.logs[toStr(n)] || 0;
const isDone = (h, n) => val(h, n) >= goalOf(h);

function flexInfo(h) {
  const s = h.sched;
  if (s.kind === 'weekly') return { unit: 'week', quota: s.perWeek };
  if (s.kind === 'custom' && s.mode === 'permonth') return { unit: 'month', quota: s.perMonth };
  return null;
}
function isScheduledDay(h, n) {
  const s = h.sched;
  if (s.kind === 'daily') return true;
  if (s.kind === 'days') return s.days.indexOf(dowOf(n)) >= 0;
  if (s.kind === 'custom') {
    if (s.mode === 'interval') { const d = n - toNum(s.anchor || h.start); return ((d % s.n) + s.n) % s.n === 0; }

}

/* A "unit" is one obligation: a scheduled day, or one week/month for flexible habits. */
function buildUnits(h, t) {

function statsOf(h, t) {

  st.forEach(u => { if (u.hit) { if (!cur) { cur = { len: 0, a: u.a, b: u.b }; runs.push(cur); } cur.len++; cur.b = u.b; } else cur = null; });
  const last = st[st.length - 1], curRun = last && last.hit ? runs[runs.length - 1] : null;

  for (const k in h.logs) { const v = h.logs[k]; totalCount += v; if (v >= g) totalDone++; }

    best: runs.reduce((m, r) => Math.max(m, r.len), 0), totalDone: totalDone, totalCount: totalCount };

  let need = 0, got = 0;
  for (const u of units) if (u.settled && u.a >= a && u.a <= b) { need += u.need; got += u.got; }

let SC = new Map();
const S = h => { let s = SC.get(h.id); if (!s) { s = statsOf(h, T()); SC.set(h.id, s); } return s; };
const pctTxt = p => p == null ? '–' : Math.round(p * 100) + '%';
function unitLabel(h, n) {
  const fx = flexInfo(h);
  return (fx ? fx.unit : h.sched.kind === 'daily' ? 'day' : 'scheduled day') + (n === 1 ? '' : 's');

function scheduleText(h) {
  const s = h.sched;

  if (s.kind === 'weekly') return s.perWeek + '× a week, any days';
  if (s.kind === 'days') return s.days.length === 7 ? 'Every day' : WD_ORDER.filter(d => s.days.indexOf(d) >= 0).map(d => WD_SHORT[d]).join(', ');

function cellInfo(h, n, t) {
  const v = val(h, n), g = goalOf(h), done = v >= g, fx = flexInfo(h); let cls;
  if (done) cls = 'c-done'; else if (v > 0) cls = 'c-part';
  else if (fx) cls = n >= toNum(h.start) ? 'c-open' : 'c-rest';
  else if (n >= toNum(h.start) && isScheduledDay(h, n)) cls = n < t ? 'c-miss' : 'c-due';

function setLog(hid, ds, value) {
  const h = find(hid); if (!h) return;
  value = Math.max(0, Math.round(Number(value) * 100) / 100); if (!isFinite(value)) value = 0;

/* =========================================================
   Value trackers (type "log"): wake-up time, bedtime, study hours, any number.

   ========================================================= */
const isLog = h => h.type === 'log';
const H12 = (() => { try { return !!new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hour12; } catch (e) { return false; } })();
const VK_LABEL = { time: 'Time of day', night: 'Bedtime', dur: 'Hours', num: 'Number' };
const numTxt = v => String(Math.round(v * 100) / 100);
function clockParts(m) {
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  const hh = Math.floor(m / 60), mm = m % 60;
  if (!H12) { const x = pad(hh) + ':' + pad(mm); return { main: x, sub: '', compact: x }; }
  const h12 = hh % 12 || 12, ap = hh < 12 ? 'AM' : 'PM';
  return { main: h12 + ':' + pad(mm), sub: ap, compact: h12 + ':' + pad(mm) + ap.charAt(0).toLowerCase() };
}
function durTxt(m, compact) {
  m = Math.max(0, Math.round(m)); const hh = Math.floor(m / 60), mm = m % 60;
  if (!hh) return mm + 'm';
  return compact ? hh + 'h' + (mm ? pad(mm) : '') : hh + 'h' + (mm ? ' ' + mm + 'm' : '');

function logParts(h, v) {
  if (h.vk === 'time' || h.vk === 'night') return clockParts(v);
  if (h.vk === 'dur') return { main: durTxt(v), sub: '', compact: durTxt(v, true) };
  return { main: numTxt(v), sub: h.unit || '', compact: fmtNum(v) };

const logTxt = (h, v) => { const p = logParts(h, v); return p.main + (p.sub ? ' ' + p.sub : ''); };

const logY = (h, v) => h.vk === 'night' && v < 720 ? v + 1440 : v;

  const h = find(hid); if (!h) return;

  const inner = kind === 'cal' ? '<span class="dn">' + ymd(n).d + '</span>' + (has ? '<span class="dv">' + esc(logShort(h, v)) + '</span>' : '') : has ? esc(logShort(h, v)) : '';
  const lab = h.name + ', ' + fmt(n, { weekday: 'long', month: 'long', day: 'numeric' }) + ': ' + (has ? logTxt(h, v) : future ? 'upcoming' : 'not logged');
  return '<button class="cell lgv ' + kind + ' ' + cls + (n === t ? ' is-today' : '') + '" data-act="cell" data-h="' + h.id + '" data-d="' + ds + '" aria-label="' + esc(lab) + '"' + (future ? ' disabled' : '') + '>' + inner + '</button>';
}
function logCard(h, t, wk) {
  const r = logRange(h, wk, wk + 6);
  let cells = ''; for (let i = 0; i < 7; i++) cells += logCell(h, wk + i, t, 'w');
  const sub = VK_LABEL[h.vk] + (h.vk === 'num' && h.unit ? ', ' + esc(h.unit) : '') + ', ' + (r.pts.length ? r.pts.length + ' logged this week' : 'nothing logged this week');
  return '<article class="card" style="' + colorVars(h.color) + '">' +
    '<button class="card-h" data-act="open" data-h="' + h.id + '"><i class="dot"></i><span class="tt"><b>' + esc(h.name) + '</b><small>' + sub + '</small></span>' +
    '<span class="chips">' + (r.avg != null ? '<span class="chip" title="Average this week">avg ' + esc(logTxt(h, r.avg)) + '</span>' : '') + '</span></button>' +
    '<div class="days">' + cells + '</div></article>';

  return '<tr style="' + colorVars(h.color) + '"><th class="nm" scope="row"><button class="nmb" data-act="open" data-h="' + h.id + '"><i class="dot"></i><span class="t">' + esc(h.name) + '</span></button>' +
    '<small><span>' + (r.avg != null ? 'avg ' + esc(logTxt(h, r.avg)) : 'no entries') + '</span></small></th>' + tds + '</tr>';
}

function niceStepFor(raw, minutes) {
  if (minutes) { const L = [5, 10, 15, 30, 60, 120, 180, 240, 360, 480, 720]; for (let i = 0; i < L.length; i++) if (L[i] >= raw) return L[i]; return 1440; }

const DRIVE_META_KEY = 'tally:v1:drive:meta';

function initDriveAuth() {

function getDriveToken(prompt) {

async function driveFetch(url, options) {

      const remoteChanged=meta.lastDriveHash?remoteHash!==meta.lastDriveHash:true;

function showDriveConflict(kind){

    else if(window.confirm('Use the Google Drive version instead?\n\nOK = download Drive and replace this device after confirmation.\nCancel = leave both versions unchanged.')) driveDownload(true);
  }else{

async function driveSync(){

    await getDriveToken('');
    const folder=await findDriveFolder(), file=await findDriveFile(folder.id), meta=driveMetaGet(), localHash=snapshotHash(makeBackup());
    if(!file){ if(window.confirm('No Tally sync file exists in Drive. Upload this device\'s tracker data to create it?')) await driveUpload(true); return; }
    const remote=await readDriveFile(file.id), remoteHash=remote.data.stateHash;
    if(localHash===remoteHash){rememberDriveSync(file.id,folder.id,remote.data);toast('Already up to date.');renderOverlay();return;}

    const remoteChanged=meta.lastDriveHash?remoteHash!==meta.lastDriveHash:true;

/* =========================================================
   Backup / restore
   ========================================================= */
const BACKUP_VERSION = 2, BACKUP_ACCEPTED = [1, 2];   // v2 adds value trackers; v1 backups still restore

function makeBackup() {
  return {
    app: 'Tally',
    backupVersion: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    habits: clone(state.habits),
    settings: clone(state.settings)
  };
}

function exportBackup() {
  try {
    const payload = JSON.stringify(makeBackup(), null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'tally-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup exported. Keep the file somewhere safe.');
  } catch (e) {
    toast('Could not create the backup.');
  }
}

function restoreBackupFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || data.app !== 'Tally' || !Array.isArray(data.habits) || !data.settings || BACKUP_ACCEPTED.indexOf(data.backupVersion) < 0) {
        throw new Error('Invalid backup');
      }
      const restored = data.habits.map(normalize);
      const count = restored.length;
      const confirmed = window.confirm(
        'Restore this backup? This will replace the habits and history currently on this phone.\n\n' +
        count + ' habit' + (count === 1 ? '' : 's') + ' will be restored.'
      );
      if (!confirmed) return;

      state.habits = restored.sort(byOrder);
      if (data.settings.weekStart === 0 || data.settings.weekStart === 1) {
        state.settings.weekStart = data.settings.weekStart;
      }

      if (P.mode === 'local') {
        const okH = lsSet(LS_H, state.habits);
        const okS = lsSet(LS_S, state.settings);
        if (!okH || !okS) throw new Error('Storage unavailable');
      } else if (P.mode === 'db') {
        state.habits.forEach(h => persist(h.id));
        saveSettings();
      }

      SC.clear();
      state.sheet = null;
      render();
      toast('Backup restored successfully.');
    } catch (e) {
      toast('That file is not a valid Tally backup.');
    }
  };
  reader.onerror = () => toast('Could not read the backup file.');
  reader.readAsText(file);
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (file) restoreBackupFile(file);
    input.remove();
  });
  document.body.appendChild(input);
  input.click();
}

/* =========================================================
   Events
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, D = el.dataset, d = state.draft;
  switch (a) {
    case 'mode': state.mode = D.v; renderMain(); break;
    case 'prev': state.anchor = state.mode === 'week' ? state.anchor - 7 : monthStartOf(state.anchor) - 1; renderMain(); break;
    case 'next': state.anchor = state.mode === 'week' ? state.anchor + 7 : monthEndOf(state.anchor) + 1; renderMain(); break;
    case 'today': state.anchor = T(); renderMain(); break;
    case 'cell': {
      const h = find(D.h); if (!h) break;
      if (h.type === 'check') { const was = isDone(h, toNum(D.d)); setLog(h.id, D.d, was ? 0 : 1); state.pop = was ? null : h.id + D.d; renderMain(); setTimeout(() => { state.pop = null; }, 600); }
      else if (isLog(h)) { state.sheet = { kind: 'log', hid: h.id, ds: D.d }; renderOverlay(); }
      else { state.sheet = { kind: 'count', hid: h.id, ds: D.d }; renderOverlay(); }
      break;
    }
    case 'open': openDetail(D.h); break;
    case 'back': goHome(); break;
    case 'new': openForm(D.tpl != null ? TEMPLATES[+D.tpl] : null); break;
    case 'edit': openEdit(state.hid); break;
    case 'ask-delete': state.sheet = { kind: 'delete' }; renderOverlay(); break;
    case 'confirm-delete': { const id = state.hid; state.habits = state.habits.filter(h => h.id !== id); persist(id); state.sheet = null; renderOverlay(); goHome(); break; }
    case 'close-sheet': state.sheet = null; renderOverlay(); break;
    case 'settings': state.sheet = { kind: 'settings' }; renderOverlay(); break;
    case 'export-backup': exportBackup(); break;
    case 'import-backup': importBackup(); break;
    case 'drive-save-client': saveDriveClientId(); break;
    case 'drive-connect': connectDrive(); break;
    case 'drive-sync': driveSync(); break;
    case 'drive-upload': driveUpload(false); break;
    case 'drive-download': driveDownload(false); break;
    case 'drive-disconnect': disconnectDrive(); break;
    case 'ws': state.settings.weekStart = +D.v; saveSettings(); renderMain(); renderOverlay(); break;
    case 'cal-prev': state.calMonth = monthStartOf(state.calMonth - 1); renderMain(); break;
    case 'cal-next': state.calMonth = monthEndOf(state.calMonth) + 1; renderMain(); break;
    case 'cal-today': state.calMonth = monthStartOf(T()); renderMain(); break;
    case 'gran': state.gran = D.v; renderMain(); break;
    case 'lg-range': state.lgRange = +D.v; renderMain(); break;
    case 'log-today': state.sheet = { kind: 'log', hid: state.hid, ds: todayStr() }; renderOverlay(); break;
    case 'lg-save': saveLogSheet(); break;
    case 'lg-clear': { const sh = state.sheet; if (sh) { setEntry(sh.hid, sh.ds, null); state.sheet = null; renderOverlay(); renderMain(); } break; }
    case 'sh-inc': case 'sh-clear': case 'sh-goal': {
      const h = find(state.sheet.hid), n = toNum(state.sheet.ds), cur = val(h, n);
      setLog(h.id, state.sheet.ds, a === 'sh-inc' ? cur + Number(D.d) : a === 'sh-clear' ? 0 : goalOf(h));
      renderMain(); renderOverlay(); break;
    }
    case 'wf-set': d[D.f] = D.v; d.err = ''; renderMain(false); break;
    case 'wf-step': d[D.f] = clampN((Number(d[D.f]) || 0) + Number(D.d), +D.min, +D.max); renderMain(false); break;
    case 'wf-day': { const v = +D.v, i = d.days.indexOf(v); if (i >= 0) d.days.splice(i, 1); else d.days.push(v); d.err = ''; renderMain(false); break; }
    case 'wf-md': { const v = +D.v, i = d.monthDays.indexOf(v); if (i >= 0) d.monthDays.splice(i, 1); else d.monthDays.push(v); d.err = ''; renderMain(false); break; }
    case 'step-next': { const er = validateStep(d.step); if (er) { d.err = er; renderMain(false); } else { d.err = ''; d.step++; renderMain(false); window.scrollTo(0, 0); } break; }
    case 'step-back': d.err = ''; d.step--; renderMain(false); window.scrollTo(0, 0); break;
    case 'step-go': { const to = +D.v; if (to > d.step) { for (let s = d.step; s < to; s++) { const er = validateStep(s); if (er) { d.err = er; renderMain(false); return; } } } d.err = ''; d.step = to; renderMain(false); window.scrollTo(0, 0); break; }
    case 'save-draft': saveDraft(); break;
    case 'cancel-draft': { const id = d && d.id; state.draft = null; if (id && find(id)) openDetail(id); else goHome(); break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.field && state.draft) {
    const f = el.dataset.field; state.draft[f] = el.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value; state.draft.err = '';
    if (f === 'color') { const root = APP.querySelector('.wrap'); if (root) root.setAttribute('style', colorVars(el.value)); }
  } else if (el.id === 'sh-input' && state.sheet) {
    const h = find(state.sheet.hid); if (!h) return;
    const v = el.value === '' ? 0 : Number(el.value); setLog(h.id, state.sheet.ds, v); renderMain();
    const bar = OVER.querySelector('.pbar i'); if (bar) bar.style.width = Math.min(100, v / goalOf(h) * 100) + '%';
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.field && state.draft) {
    if (el.type === 'number') { const v = clampN(el.value, +el.dataset.min || 1, +el.dataset.max || 100000); state.draft[el.dataset.field] = v; el.value = v; }
    else if (el.type === 'color') renderMain(false);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) { state.sheet = null; renderOverlay(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && state.sheet && state.sheet.kind === 'log' && e.target && e.target.tagName === 'INPUT') { e.preventDefault(); saveLogSheet(); } });

/* new day rollover */
let lastDay = todayStr();
function tick() {
  const t = todayStr(); if (t === lastDay) return;
  if (state.anchor === toNum(lastDay)) state.anchor = toNum(t);
  lastDay = t; rerender();
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

init();
})();
</script>
